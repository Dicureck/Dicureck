name: Engineering Labs — Python and .NET
on:
  push:
    paths:
      - 'engineering-labs/**'
      - '.github/workflows/engineering-labs.yml'
  pull_request:
    paths:
      - 'engineering-labs/**'
      - '.github/workflows/engineering-labs.yml'
  workflow_dispatch:
  schedule:
    - cron: '14 8 * * 1'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s engineering-labs/ai-business-automation/tests -v
      - name: Scheduled-safe dry run (no API keys or mail sends)
        run: python engineering-labs/ai-business-automation/main.py --output output/ai-demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-preview
          path: output/ai-demo/
          retention-days: 7
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build engineering-labs/enterprise-reporting-dotnet/src/ReportingLab.csproj -c Release -warnaserror
      - name: Decimal and validation self-test
        run: dotnet run --no-restore --project engineering-labs/enterprise-reporting-dotnet/src/ReportingLab.csproj -- --self-test
      - name: Produce synthetic report
        run: dotnet run --no-restore --project engineering-labs/enterprise-reporting-dotnet/src/ReportingLab.csproj -- --input engineering-labs/enterprise-reporting-dotnet/fixtures/orders.csv --output output/dotnet-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-dotnet-report
          path: output/dotnet-report.json
          retention-days: 7
  enterprise_bi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic data, RDL, SQL, DAX and Tableau contract
        run: python -m unittest discover -s engineering-labs/enterprise-bi-reporting/tests -v
      - name: Produce original offline dashboard and report
        run: python engineering-labs/enterprise-bi-reporting/src/report.py --out output/enterprise-bi
      - name: Verify generated output structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('output/enterprise-bi')
          result = json.loads((out / 'report.json').read_text(encoding='utf-8'))
          assert result['overall']['orders'] == 72
          assert len(result['by_month_region']) == 12
          assert (out / 'dashboard.html').stat().st_size > 3000
          print('Synthetic Enterprise BI report generated and reconciled')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-enterprise-bi-dashboard
          path: output/enterprise-bi/
          retention-days: 14
