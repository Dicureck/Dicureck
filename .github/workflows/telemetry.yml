name: Refresh public portfolio telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_telemetry.py'
      - '.github/workflows/telemetry.yml'

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline telemetry contracts
        run: python -m unittest discover -s tests -v
      - name: Refresh SVG from public GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_telemetry.py
      - name: Commit generated telemetry if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public repository telemetry [skip ci]"
            git push
          fi
